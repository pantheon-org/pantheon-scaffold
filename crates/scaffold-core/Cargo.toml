[package]
name = "scaffold-core"
version = "0.0.0"
description = "Shared types of the pantheon-scaffold runner: the contract the pkl package renders and the manifest the runner keeps."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
ureq = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.10"
saphyr = "0.3.3"
saphyr-parser = "0.3.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
