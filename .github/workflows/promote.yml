name: promote

# Promotes a published pre-release to a stable release (decisions 46, 56, 60, 90 and 91). By hand only, from main.
# The first job runs every guard and edits nothing: it is the whole of a dry run, and it never touches the environment.
# The second job is the only one that can edit a release. It names the environment "promote", runs every guard again,
# removes the pre-release flag, and checks that the assets and checksums.txt did not change. The environment has no
# protection rules while the repository has one contributor (decision 91), so it records the run and does not gate it:
# see "Before onboarding a contributor" in docs/release-process.md.
#
# Phase 2 of docs/ts-tooling-rust-port.md: the tool is the Rust one (crates/scaffold-release). It is built in a job of its own that can
# read the repository and nothing else, and the two jobs below download it and check its checksum. The TypeScript version, which the guards
# job once ran beside it and the promote job could run instead, was deleted in Phase 6.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to promote, for example v0.1.5
        type: string
        required: true
      dry_run:
        description: Run every guard and edit nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  # The release tool is built here, in a job that can read the repository and nothing else: no write permission and no token in its
  # environment. A build runs the build scripts of every crate it depends on, and that must never happen next to a token that can
  # write. guards and promote only download the finished binary and check its checksum.
  tool:
    name: Build the release tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the release tool
        id: build
        run: |
          cargo build --release --locked -p scaffold-release
          echo "sha256=$(sha256sum target/release/scaffold-release | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-release
          path: target/release/scaffold-release
          retention-days: 7
          if-no-files-found: error

  guards:
    name: Check every guard
    needs: tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scaffold-release
          path: tool/
      - name: Check that the release tool is the one that was built
        env:
          EXPECTED: ${{ needs.tool.outputs.sha256 }}
        run: |
          echo "$EXPECTED  tool/scaffold-release" | sha256sum --check --strict -
          chmod +x tool/scaffold-release
      - name: Run every guard, edit nothing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: tool/scaffold-release promote check "$TAG"

  promote:
    name: Promote the release
    needs: [tool, guards]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: promote
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scaffold-release
          path: tool/
      - name: Check that the release tool is the one that was built
        env:
          EXPECTED: ${{ needs.tool.outputs.sha256 }}
        run: |
          echo "$EXPECTED  tool/scaffold-release" | sha256sum --check --strict -
          chmod +x tool/scaffold-release
      - name: Run every guard again, remove the pre-release flag, and check the result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: tool/scaffold-release promote promote "$TAG"
