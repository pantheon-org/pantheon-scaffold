# cargo-mutants 27.1.0 (installed with `cargo install cargo-mutants --version 27.1.0 --locked`).
# The features crate only drives a binary, so it holds nothing to mutate. The binary's main is five lines that only the
# real binary runs, which the cucumber features do. The unit tests of the other crates kill the
# mutants.
exclude_globs = ["crates/scaffold-features/**", "crates/scaffold-cli/src/main.rs"]

# A justified survivor, excluded by name. `migrate` plans the render as a dry run first and stops on any refusal, so the render that
# writes can only refuse if a file changes between the two calls. No test can cause that without a race; the guard is kept so that a
# refusal in that case still removes the scaffold.pkl it wrote. The mutant that makes the guard always true behaves the same on every
# run that reaches it. The mutant that makes it always false is caught (the successful write test).

# Phase 4 of docs/ts-tooling-rust-port.md (decision D3: say up front which functions are excluded). These functions only drive other
# programs, the runner, pkl, unzip and a local web server, and what they check is a verdict about a real run. A mutation such as `&&`
# to `||` in one of their checks changes nothing while the checks pass, and a test that would tell it needs the whole scenario, about
# twenty seconds, for each of the 190 mutants: too slow for the 45 minute limit of the mutation job. They are proved another way, by the
# integration tests of crates/scaffold-release/tests/smoke.rs (a wrong version, a broken wrapper, an unrunnable binary, a failing setup)
# and by the rust-binary job of ci.yml, which runs the smoke suite against the release binary on the three platforms. In Phases 4 and 5
# they were also compared with the TypeScript originals on the three platforms, before Phase 6 deleted those. The helpers around them
# are not excluded.
exclude_re = [
    "replace match guard done\\.refusals\\.is_empty\\(\\) with true in run_migrate",
    "crates/scaffold-release/src/smoke\\.rs:\\d+:\\d+: .*\\b(in|replace) (suite|basics|render_flow|lock_flow|case_flow|orphan_clean|orphan_dirty)( |$)",
    "crates/scaffold-release/src/baseline/packaged\\.rs:\\d+:\\d+: .*\\b(in|replace) (run|compare_set|check_zip|packaged)( |$)",
]
