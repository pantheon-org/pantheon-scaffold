name: scaffold-check
'on':
  pull_request:
    branches:
    - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Scaffold check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.10.25
        install: false
        cache: false
    - name: Install the pinned tools from the lock file
      run: mise install --locked
    - name: Keep the package cache so an outage does not block the check
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pkl-gen/cache
        key: pantheon-scaffold-${{ hashFiles('pantheon.pkl') }}
        restore-keys: pantheon-scaffold-
    - name: Check that the scaffold files match the render
      run: mise x -- pantheon-scaffold check pantheon.pkl --attempts 3