name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Lint the workflows
        run: mise x -- actionlint
      - name: Evaluate every pkl module
        run: |
          for f in pkl/*.pkl; do
            mise x -- pkl eval "$f" > /dev/null
          done
      - name: Build the package
        run: mise x -- pkl project package pkl --output-path "$RUNNER_TEMP/package"
      - name: Run the runner tests
        working-directory: runner
        run: mise x -- bun test
