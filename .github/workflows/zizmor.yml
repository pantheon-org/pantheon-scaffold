# Static analysis for GitHub Actions security problems: credential persistence,
# template injection, over-broad permissions, unpinned actions. A finding at
# high severity fails the job.
#
# This runs beside Plumber rather than replacing it. Plumber reports without
# blocking; zizmor blocks, and covers credential persistence and template
# injection, which Plumber does not.
#
# No path filter, so the check always reports a conclusion: a required check
# that is skipped blocks the pull request forever. Also runs on push to main as
# a post-merge safety net.
#
# Scans .github only: the workflows and dependabot.yml. The action's default
# input is the whole repository, which this gate does not need to cover.
#
# Run it locally with the same findings (zizmor is pinned in mise.toml):
#   GH_TOKEN=$(gh auth token) mise exec -- zizmor --min-severity high .github
name: zizmor
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        version: 1.32.0
        min-severity: high
        inputs: .github
        advanced-security: false