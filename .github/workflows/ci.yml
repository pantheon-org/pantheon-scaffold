name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise cannot lock Rust, so `mise install --locked` must skip it. Jobs that need Rust install it with rustup (see rust-toolchain.toml).
  MISE_DISABLE_TOOLS: rust

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Lint the workflows
        run: mise x -- actionlint
      - name: Evaluate every pkl module
        run: |
          for f in pkl/*.pkl; do
            mise x -- pkl eval "$f" > /dev/null
          done
      - name: Build the package
        run: mise x -- pkl project package pkl --output-path "$RUNNER_TEMP/package"
      - name: Run the runner tests
        working-directory: runner
        run: mise x -- bun test
      - name: Lint the consumer check sample
        run: mise x -- actionlint runner/test/fixtures/consumer-check.yml
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      - name: Check the Rust formatting
        run: cargo fmt --all --check
      - name: Lint the Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run the Rust unit tests
        run: mise x -- cargo test --workspace --exclude scaffold-features --locked
      - name: Check the Rust dependencies (licences, advisories, sources)
        run: mise x -- cargo-deny check

  # Mutation testing takes about ten minutes in full, so it runs beside the other checks and not inside them. A pull request
  # mutates only the code its diff touches; every push to main runs the full set, so a survivor elsewhere cannot hide.
  # cargo-mutants fails on any surviving mutant (stricter than the 90 percent of the plan); a justified survivor is excluded
  # by name in .cargo/mutants.toml, with the reason beside it.
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      # mise has no macOS arm64 build of cargo-mutants, so it is built from source at a pinned version.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutation-test the code this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          mise x -- cargo mutants --package scaffold-core --package scaffold-cli --jobs 2 --in-diff "$RUNNER_TEMP/pr.diff"
      - name: Mutation-test the whole Rust core
        if: github.event_name != 'pull_request'
        run: mise x -- cargo mutants --package scaffold-core --package scaffold-cli --jobs 2

  build:
    name: Build the binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILD_VERSION: 0.0.1-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Build the runner for the three targets
        run: mise x -- bun runner/scripts/build.ts --version "$BUILD_VERSION" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILD_VERSION: 0.0.1-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/
      - name: Make the binary executable
        run: chmod +x "dist/pantheon-scaffold-${{ matrix.target }}"
      - name: Run the smoke suite against the built binary
        run: mise x -- bun runner/scripts/smoke.ts "dist/pantheon-scaffold-${{ matrix.target }}" --version "$BUILD_VERSION"

  features:
    name: Features ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCAFFOLD_BIN: ${{ github.workspace }}/dist/pantheon-scaffold-${{ matrix.target }}
      SCAFFOLD_VERSION: 0.0.1-ci.${{ github.run_number }}
      # Scenarios written ahead of the code (Presets, task 4.3). The tag leaves this list in the pull request that makes them pass.
      SCAFFOLD_SKIP_TAGS: pending-presets-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist/
      - name: Make the binary executable
        run: chmod +x "$SCAFFOLD_BIN"
      - name: Run the features against the built binary
        run: mise x -- cargo test -p scaffold-features --locked

  # The same features, run against the Rust build. SCAFFOLD_SKIP_TAGS (see features/README.md) skips only the Preset scenarios that
  # are written ahead of the code (task 4.3); every other scenario runs.
  features-rust:
    name: Features (Rust) ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCAFFOLD_VERSION: 0.0.1-ci.${{ github.run_number }}
      SCAFFOLD_BIN: ${{ github.workspace }}/target/debug/pantheon-scaffold
      SCAFFOLD_SKIP_TAGS: pending-presets-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the Rust runner
        run: cargo build -p scaffold-cli --locked
      - name: Run the features against the Rust build
        run: mise x -- cargo test -p scaffold-features --locked
      # Every fixture configuration (all of them build on the Builtins) rendered by both runners and compared byte for byte.
      # It goes with the TypeScript runner when that is removed (plan task 3.4).
      - name: Compare what the Rust and TypeScript runners write for every Builtin
        run: mise x -- bun runner/scripts/builtin-differential.ts target/debug/pantheon-scaffold

  # The release binary, built the way a release builds it (runner/scripts/build-rust.ts: static musl on Linux with zig cc, native on macOS),
  # with the smoke suite run against it, on every pull request. The release workflow runs the same two scripts on a tag.
  rust-binary:
    name: Rust binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILD_VERSION: 0.0.1-ci.${{ github.run_number }}
      # Adds zig (mise.rust-build.toml), which compiles the C code of ring for the static Linux builds.
      MISE_ENV: rust-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the release binary
        run: mise x -- bun runner/scripts/build-rust.ts --target "${{ matrix.target }}" --version "$BUILD_VERSION" --out dist
      - name: Run the smoke suite against it
        run: mise x -- bun runner/scripts/smoke.ts "dist/pantheon-scaffold-${{ matrix.target }}" --version "$BUILD_VERSION"
