name: update-pins

# Weekly: moves the pinned actions in pkl/Pins.pkl to their latest published release (one pull request),
# then records the date of the last successful check on the `freshness` branch. A failed check writes neither, so a failing check never reads as fresh.
# Writes use the pantheon-ai-bot App token (contents and pull-requests write), so the pull request starts the required checks.
#
# Phase 3 of docs/ts-tooling-rust-port.md: the tool is the Rust one (crates/scaffold-release). It is built in a job of its own that can read the
# repository and nothing else, and the update job downloads it and checks its checksum before it runs it.
# A manual run is a dry run unless told otherwise: it checks every pin with both tools, writes nothing, and fails if the two disagree. A real run
# (the schedule, or a manual run with dry_run off) uses the Rust tool, or the TypeScript one when `implementation` says so, which is the way back.
# There is no push trigger on purpose. It used to run the workflow when the workflow or its tool changed on main, and so merging the change that
# moved the tool would have started a real run, with the App token, of a tool nobody had watched run yet. Restore it after the first real run.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check every pin with both tools and write nothing (no pull request, no freshness record)
        type: boolean
        default: true
      implementation:
        description: Which tool writes in a real run. A dry run runs both
        type: choice
        options:
          - rust
          - typescript
        default: rust

permissions: {}

concurrency:
  group: update-pins
  cancel-in-progress: false

env:
  # mise cannot lock Rust, so `mise install --locked` must skip it. Jobs that need Rust install it with rustup (see rust-toolchain.toml).
  MISE_DISABLE_TOOLS: rust

jobs:
  # The release tool is built here, in a job that can read the repository and nothing else: no write permission and no token in its
  # environment. A build runs the build scripts of every crate it depends on, and that must never happen next to a token that can
  # write. The update job only downloads the finished binary and checks its checksum.
  tool:
    name: Build the release tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the release tool
        id: build
        run: |
          cargo build --release --locked -p scaffold-release
          echo "sha256=$(sha256sum target/release/scaffold-release | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-release
          path: target/release/scaffold-release
          retention-days: 7
          if-no-files-found: error

  update:
    name: Update the pins
    needs: tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A dry run writes nothing, so it does not mint a token that can: it reads with the workflow's own read-only token.
      - name: Mint pantheon-ai-bot token
        id: app-token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23ligzn16vkDCWfHgc
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scaffold-release
          path: tool/
      - name: Check that the release tool is the one that was built
        env:
          EXPECTED: ${{ needs.tool.outputs.sha256 }}
        run: |
          echo "$EXPECTED  tool/scaffold-release" | sha256sum --check --strict -
          chmod +x tool/scaffold-release
      # mise and bun are needed only by the TypeScript tool: in a dry run, which runs both, and when a real run asks for it.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.implementation == 'typescript') }}
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.implementation == 'typescript') }}
        run: mise install --locked
      # Both tools run, the Rust one is the answer, and a difference between them fails the job. The TypeScript tool goes when Phase 6 of
      # docs/ts-tooling-rust-port.md deletes it.
      - name: Check every pin with both tools, write nothing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rust_code=0
          tool/scaffold-release update-pins --no-write > "$RUNNER_TEMP/rust.out" 2> "$RUNNER_TEMP/rust.err" || rust_code=$?
          ts_code=0
          mise x -- bun runner/scripts/update-pins.ts --no-write > "$RUNNER_TEMP/ts.out" 2> "$RUNNER_TEMP/ts.err" || ts_code=$?
          cat "$RUNNER_TEMP/rust.out"
          cat "$RUNNER_TEMP/rust.err" >&2
          if [ "$rust_code" != "$ts_code" ] || ! cmp -s "$RUNNER_TEMP/rust.out" "$RUNNER_TEMP/ts.out" || ! cmp -s "$RUNNER_TEMP/rust.err" "$RUNNER_TEMP/ts.err"; then
            echo "The Rust and the TypeScript tool disagree (exit $rust_code and $ts_code). The TypeScript tool printed:" >&2
            cat "$RUNNER_TEMP/ts.out" "$RUNNER_TEMP/ts.err" >&2
            exit 1
          fi
          exit "$rust_code"
      - name: Check every pin and rewrite the ones that moved
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && inputs.implementation != 'typescript' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tool/scaffold-release update-pins \
            --freshness-out "$RUNNER_TEMP/freshness.json" --summary "$RUNNER_TEMP/summary.md"
      # The way back: the TypeScript tool, as before Phase 3.
      - name: Check every pin and rewrite the ones that moved (TypeScript)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && inputs.implementation == 'typescript' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mise x -- bun runner/scripts/update-pins.ts \
            --freshness-out "$RUNNER_TEMP/freshness.json" --summary "$RUNNER_TEMP/summary.md"
      - name: Open or update the pin pull request
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet pkl/Pins.pkl; then echo "No pin changed."; exit 0; fi
          branch="chore/update-pins"
          git switch -c "$branch"
          git add pkl/Pins.pkl
          git -c user.name="pantheon-ai-bot[bot]" -c user.email="pantheon-ai-bot[bot]@users.noreply.github.com" \
            commit --message "chore(deps): update pinned actions"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --head "$branch" --title "chore(deps): update pinned actions" --body-file "$RUNNER_TEMP/summary.md"
          fi
      - name: Record the successful check on the freshness branch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git switch --orphan freshness-record
          cp "$RUNNER_TEMP/freshness.json" freshness.json
          git add freshness.json
          git -c user.name="pantheon-ai-bot[bot]" -c user.email="pantheon-ai-bot[bot]@users.noreply.github.com" \
            commit --message "chore: record the pin check"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/freshness
