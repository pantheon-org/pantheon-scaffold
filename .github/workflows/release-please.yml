# Keeps one rolling release PR up to date on every push to main (the version, plus
# CHANGELOG.md and the manifest, from conventional commits). When that PR is merged
# the same run creates the vX.Y.Z tag and a DRAFT release (draft and force-tag-creation
# in release-please-config.json). The tag starts the release workflow of the repository,
# which builds the assets and publishes the draft as a pre-release with
# .github/scripts/publish-release.sh.
# The version line of pkl/PklProject is updated through the x-release-please-version
# comment on it.
#
# Uses the pantheon-ai-bot App token because a tag created with GITHUB_TOKEN does not
# trigger other workflows. Needs the org secret GH_APP_PRIVATE_KEY.
name: Release Please
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release-please:
    name: Update release PR and tag releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Mint pantheon-ai-bot token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: Iv23ligzn16vkDCWfHgc
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json