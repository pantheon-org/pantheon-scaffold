# cargo-deny 0.20.2: licences, advisories, duplicate versions and sources for every dependency.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # ureq: ring ("Apache-2.0 AND ISC") and rustls-webpki.
    "ISC",
    # ureq: webpki-roots, the Mozilla CA list as data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a sibling crate of this workspace has no version to pin. Every crate here is publish = false, and
# registry dependencies still need a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
