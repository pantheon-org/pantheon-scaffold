name: scaffold-check

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Scaffold check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Keep the package cache so an outage does not block the check
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pkl-gen/cache
          key: pantheon-scaffold-${{ hashFiles('pantheon.pkl') }}
          restore-keys: pantheon-scaffold-
      - name: Check that the scaffold files match the render
        run: mise x -- pantheon-scaffold check pantheon.pkl --attempts 3
