name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise cannot lock Rust, so `mise install --locked` must skip it. Jobs that need Rust install it with rustup (see rust-toolchain.toml).
  MISE_DISABLE_TOOLS: rust

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Lint the workflows
        run: mise x -- actionlint
      - name: Evaluate every pkl module
        run: find pkl -name '*.pkl' -print0 | xargs -0 -n1 mise x -- pkl eval > /dev/null
      - name: Build the package
        run: mise x -- pkl project package pkl --output-path "$RUNNER_TEMP/package"
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      # The package tests read what the package renders through the Rust runner (runner/test/support/contract.ts).
      - name: Build the Rust runner for the package tests
        run: cargo build -p scaffold-cli --locked
      - name: Run the runner tests
        working-directory: runner
        env:
          SCAFFOLD_BIN: ${{ github.workspace }}/target/debug/pantheon-scaffold
        run: mise x -- bun test
      - name: Lint the consumer check sample
        run: mise x -- actionlint runner/test/fixtures/consumer-check.yml
      - name: Check the Rust formatting
        run: cargo fmt --all --check
      - name: Lint the Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run the Rust unit tests
        run: mise x -- cargo test --workspace --exclude scaffold-features --locked
      - name: Check the Rust dependencies (licences, advisories, sources)
        run: mise x -- cargo-deny check

  # Mutation testing takes about ten minutes in full, so it runs beside the other checks and not inside them. A pull request
  # mutates only the code its diff touches; every push to main runs the full set, so a survivor elsewhere cannot hide.
  # cargo-mutants fails on any surviving mutant (stricter than the 90 percent of the plan); a justified survivor is excluded
  # by name in .cargo/mutants.toml, with the reason beside it.
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      # mise has no macOS arm64 build of cargo-mutants, so it is built from source at a pinned version.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutation-test the code this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          mise x -- cargo mutants --package scaffold-core --package scaffold-cli --jobs 2 --in-diff "$RUNNER_TEMP/pr.diff"
      - name: Mutation-test the whole Rust core
        if: github.event_name != 'pull_request'
        run: mise x -- cargo mutants --package scaffold-core --package scaffold-cli --jobs 2

  # The features (features/*.feature), run against the Rust build: every scenario, nothing skipped. SCAFFOLD_SKIP_TAGS (see features/README.md)
  # exists for a scenario that one build cannot pass.
  features-rust:
    name: Features (Rust) ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCAFFOLD_VERSION: 0.0.1-ci.${{ github.run_number }}
      SCAFFOLD_BIN: ${{ github.workspace }}/target/debug/pantheon-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the Rust runner
        run: cargo build -p scaffold-cli --locked
      - name: Run the features against the Rust build
        run: mise x -- cargo test -p scaffold-features --locked

  # What a repository renders must not change by accident: this repository, the fixtures and an option matrix (55 configurations) are rendered
  # with the Rust runner and compared with a frozen snapshot of exit codes, file hashes and the manifest hash, made from main at 1259a90.
  # runner/scripts/builtins-baseline/README.md says how the snapshot was made and how to refresh it on purpose.
  baseline:
    name: Baseline render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the Rust runner
        run: cargo build -p scaffold-cli --locked
      - name: Render the 55 configurations and compare them with the frozen snapshot
        run: |
          mise x -- bun runner/scripts/builtins-baseline/snapshot.ts . target/debug/pantheon-scaffold "$RUNNER_TEMP/candidate"
          mise x -- bun runner/scripts/builtins-baseline/compare.ts runner/scripts/builtins-baseline/baseline.json "$RUNNER_TEMP/candidate"

  # The release binary, built the way a release builds it (runner/scripts/build-rust.ts: static musl on Linux with zig cc, native on macOS),
  # with the smoke suite run against it, on every pull request. The release workflow runs the same two scripts on a tag.
  rust-binary:
    name: Rust binary ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BUILD_VERSION: 0.0.1-ci.${{ github.run_number }}
      # Adds zig (mise.rust-build.toml), which compiles the C code of ring for the static Linux builds.
      MISE_ENV: rust-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install the pinned tools from the lock file
        run: mise install --locked
      # rustup is preinstalled on GitHub-hosted runners. The version must match rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build the release binary
        run: mise x -- bun runner/scripts/build-rust.ts --target "${{ matrix.target }}" --version "$BUILD_VERSION" --out dist
      - name: Run the smoke suite against it
        run: mise x -- bun runner/scripts/smoke.ts "dist/pantheon-scaffold-${{ matrix.target }}" --version "$BUILD_VERSION"
