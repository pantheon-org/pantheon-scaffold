# cargo-deny 0.20.2: licences, advisories, duplicate versions and sources for every dependency.

[graph]
all-features = true

[advisories]
# Each ignore has a reason and a date to look at it again. Remove it when the reason no longer holds.
ignore = [
    # humantime is unmaintained because chrono is, and it wraps chrono. It reaches this repository only through cucumber, the test harness of
    # scaffold-features, so it is a dev dependency that is not in any shipped binary. cucumber 0.23.0 is the latest release and no safe
    # upgrade exists. Look at it again by 01-12-2026: if cucumber has a release without humantime, take it and delete this entry.
    { id = "RUSTSEC-2026-0542", reason = "humantime via cucumber, a dev-only test harness; unmaintained, no upgrade exists. Review by 01-12-2026" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # ureq: ring ("Apache-2.0 AND ISC") and rustls-webpki.
    "ISC",
    # ureq: webpki-roots, the Mozilla CA list as data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency on a sibling crate of this workspace has no version to pin. Every crate here is publish = false, and
# registry dependencies still need a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
